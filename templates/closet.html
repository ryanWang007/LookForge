{% extends "base.html" %}
{% block title %}My Closet{% endblock %}
{% block content %}
<style>
  /* All styling stays in this page, not the shared CSS file. */
  .content { max-width: 1296px; margin: 36px auto; padding: 0 28px; }
  .site-header .brand { font-size: 2rem; }
  .site-header nav a[href$="/closet"] { color: #1559c7; font-weight: bold; border-bottom: 3px solid #1559c7; }
  .closet-page { color: #182230; }
  .closet-page * { box-sizing: border-box; }
  .closet-page h1 { margin: 0 0 4px; font-size: 42px; }
  .subtitle { margin: 0 0 32px; color: #5b6678; font-size: 22px; }
  .closet-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .search-wrap { position: relative; flex: 1 1 340px; max-width: 570px; }
  .search-icon { position: absolute; top: 50%; left: 14px; width: 17px; height: 17px; border: 2px solid #738093; border-radius: 50%; transform: translateY(-60%); }
  .search-icon::after { position: absolute; right: -6px; bottom: -4px; width: 8px; height: 2px; background: #738093; content: ""; transform: rotate(45deg); }
  .closet-toolbar input, .closet-toolbar select { height: 60px; border: 1px solid #ccd5e2; border-radius: 9px; background: white; color: #526073; font: inherit; font-size: 17px; }
  .closet-toolbar input { width: 100%; padding: 0 17px 0 44px; }
  .closet-toolbar select { min-width: 150px; padding: 0 17px; }
  .closet-toolbar input:focus, .closet-toolbar select:focus { outline: 2px solid #9bbdf4; outline-offset: 1px; }
  .add-clothing { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; margin-left: auto; padding: 0 22px; border: 1px solid #1559c7; border-radius: 8px; background: #1559c7; color: white; font: inherit; font-size: 17px; text-decoration: none; white-space: nowrap; }
  .add-clothing:hover { background: #104ba9; }
  .add-clothing span { font-size: 24px; font-weight: 400; line-height: 1; }
  .clothing-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .clothing-card { min-width: 0; padding: 8px; overflow: hidden; border: 1px solid #dce2eb; border-radius: 8px; background: white; }
  .clothing-photo { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1 / 1.12; overflow: hidden; border-radius: 5px; background: #f0f2f6; }
  .clothing-photo img { width: 100%; height: 100%; object-fit: contain; }
  .photo-placeholder { color: #8792a2; font-size: 42px; }
  .clothing-card h2 { margin: 14px 6px 11px; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
  .clothing-tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 6px; }
  .clothing-tag { padding: 5px 10px; border-radius: 9px; background: #edf1f6; color: #475467; font-size: 13px; }
  .tag-category { background: #e2edff; color: #1559c7; }
  .tag-season { background: #e6f6eb; color: #167338; }
  .tag-all-season { background: #fff5dc; color: #72520c; }
  .tag-color { background: #f0f2f6; color: #738093; }
  .closet-empty { padding: 46px 20px; border: 1px dashed #cbd5e1; border-radius: 9px; color: #5b6678; text-align: center; }
  .closet-empty h2 { margin: 0 0 8px; color: #253247; font-size: 20px; }
  .closet-empty p { margin: 0; }
  @media (max-width: 900px) {
    .clothing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 650px) {
    .content { margin: 26px auto; padding: 0 16px; }
    .closet-toolbar { flex-wrap: wrap; }
    .search-wrap { flex-basis: 100%; max-width: none; }
    .closet-toolbar select { flex: 1; min-width: 0; }
    .add-clothing { margin-left: 0; }
  }
  @media (max-width: 500px) {
    .closet-page h1 { font-size: 34px; }
    .subtitle { font-size: 19px; }
  }
  @media (max-width: 420px) {
    .clothing-grid { grid-template-columns: 1fr; }
  }
</style>

<section class="closet-page">
  <h1 id="closet-title">My Closet</h1>
  <p class="subtitle">View and manage the clothes in your closet.</p>

  <!-- Search and filter form -->
  <form class="closet-toolbar" action="{{ url_for('closet.index') }}" method="get">
    <label class="search-wrap">
      <span class="search-icon" aria-hidden="true"></span>
      <input type="search" name="search" placeholder="Search clothing...">
    </label>

    <!-- Category dropdown -->
    <select id="category" name="category">
      <option value="">All Categories</option>
      <option value="Shirts">Shirts</option>
      <option value="Pants">Pants</option>
      <option value="Dresses">Dresses</option>
      <option value="Jacket">Jacket</option>
      <option value="Shoes">Shoes</option>
      <option value="Other">Other</option>
    </select>

    <!-- Season dropdown -->
    <select id="season" name="season">
      <option value="">All Seasons</option>
      <option value="Spring">Spring</option>
      <option value="Summer">Summer</option>
      <option value="Fall">Fall</option>
      <option value="Winter">Winter</option>
    </select>
    
    <!-- Color dropdown -->
    <select id="color" name="color">
      <option value="">All Colors</option>
      <option value="Black">Black</option>
      <option value="White">White</option>
      <option value="Gray">Gray</option>
      <option value="Blue">Blue</option>
      <option value="Red">Red</option>
      <option value="Green">Green</option>
      <option value="Brown">Brown</option>
      <option value="Other">Other</option>
    </select>

    <a class="add-clothing" href="{{ url_for('add_clothing.index') }}"><span aria-hidden="true">+</span> Add Clothing</a>
  </form>
    
    <!-- Clothing grid -->
    <div class="clothing-grid">
        <article class="clothing-card">
          <div class="clothing-photo">
              <span class="photo-placeholder" aria-hidden="true">▧</span>
          </div>

          <h2>Clothing Item</h2>
          <div class="clothing-tags">
              <span class="clothing-tag tag-category">Category</span>
              <span class="clothing-tag tag-season">Season</span>
              <span class="clothing-tag tag-color">Color</span>
          </div>
        </article>
    </div>

    <!-- Empty closet message -->
    <div class="closet-empty">
      <h2>Your closet is empty</h2>
      <p>Add clothing to see your items here.</p>
    </div>

</section>
{% endblock %}
