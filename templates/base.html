<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LookForge{% endblock %} | LookForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('closet') }}">LookForge</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('closet') }}">My Closet</a>
      <a href="{{ url_for('looks') }}">My Looks</a>
      <a href="{{ url_for('add_clothing') }}">Add Clothing</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
