{% extends "base.html" %}
{% block title %}Add Clothing{% endblock %}
{% block content %}
<style>
  /* All styling stays in this page, not the shared CSS file. */
  .content { max-width: 1296px; margin: 36px auto; padding: 0 28px; }
  .site-header .brand { font-size: 2rem; }
  .site-header nav a[href$="/add-clothing"] { color: #1559c7; font-weight: bold; border-bottom: 3px solid #1559c7; }
  .add-page { color: #182230; }
  .add-page * { box-sizing: border-box; }
  .add-page h1 { font-size: 42px; margin: 0 0 4px; }
  .subtitle { font-size: 22px; color: #5b6678; margin: 0 0 32px; }
  .add-card { display: grid; grid-template-columns: 3fr 2fr; gap: 32px; padding: 32px 36px; background: white; border: 1px solid #d7dee8; border-radius: 9px; }
  .fields { display: grid; align-content: start; gap: 30px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .field label, .photo-title { display: block; font-size: 18px; font-weight: bold; margin-bottom: 12px; }
  .field input, .field select { width: 100%; height: 60px; padding: 0 17px; border: 1px solid #ccd5e2; border-radius: 9px; background: white; color: #526073; font: inherit; font-size: 17px; }
  .field input:focus, .field select:focus { outline: 2px solid #9bbdf4; }
  .photo { border-left: 1px solid #dce2eb; padding-left: 32px; }
  .upload { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 240px; gap: 10px; border: 2px dashed #c9d2e0; border-radius: 9px; cursor: pointer; }
  .upload:hover { background: #f4f8ff; border-color: #1559c7; }
  .upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .photo-icon { font-size: 52px; filter: grayscale(1); opacity: .55; }
  .upload b { font-size: 19px; color: #1559c7; }
  .upload small { font-size: 15px; color: #738093; }
  .preview-title { margin-top: 28px; }
  .preview { display: flex; align-items: center; justify-content: center; width: 170px; height: 165px; background: #f0f2f6; border-radius: 8px; overflow: hidden; }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  [hidden] { display: none !important; }
  .actions { display: flex; justify-content: flex-end; gap: 18px; margin-top: 28px; }
  .actions a, .actions button { min-width: 145px; padding: 17px 22px; border-radius: 8px; text-align: center; font: inherit; font-size: 17px; text-decoration: none; cursor: pointer; }
  .cancel { border: 1px solid #cfd7e3; background: white; color: #526073; }
  .save { border: 1px solid #1559c7; background: #1559c7; color: white; }
  @media (max-width: 800px) {
    .add-card { grid-template-columns: 1fr; }
    .photo { border-left: 0; border-top: 1px solid #dce2eb; padding: 26px 0 0; }
  }
  @media (max-width: 500px) {
    .content { padding: 0 16px; }
    .add-card { padding: 22px; }
    .field-row { grid-template-columns: 1fr; }
    .add-page h1 { font-size: 34px; }
  }
</style>

<section class="add-page">
  <h1>Add Clothing</h1>
  <p class="subtitle">Add a new item to your closet.</p>

  <!-- Progress Report #1: page layout only; saving is planned for Report #2. -->
  <form id="clothing-form">
    <div class="add-card">
      <div class="fields">
        <div class="field">
          <label for="name">Clothing Name</label>
          <input id="name" name="name" placeholder="e.g. Blue Shirt">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
              <option>Tops</option><option>Bottoms</option><option>Dresses</option>
              <option>Outerwear</option><option>Shoes</option><option>Accessories</option>
            </select>
          </div>
          <div class="field">
            <label for="color">Color</label>
            <select id="color" name="color">
              <option value="">Select a color</option>
              <option>Black</option><option>White</option><option>Gray</option>
              <option>Blue</option><option>Red</option><option>Green</option>
              <option>Brown</option><option>Other</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="season">Season</label>
          <select id="season" name="season">
            <option value="">Select a season</option>
            <option>Spring</option><option>Summer</option><option>Fall</option>
            <option>Winter</option><option>All Season</option>
          </select>
        </div>
      </div>

      <div class="photo">
        <span class="photo-title">Photo</span>
        <label class="upload" for="photo-input">
          <input id="photo-input" type="file" name="photo" accept="image/jpeg,image/png">
          <span class="photo-icon" aria-hidden="true">▧</span>
          <b>Click to upload a photo</b>
          <small>JPG, PNG (Max 5MB)</small>
        </label>
        <span class="photo-title preview-title">Preview</span>
        <div class="preview">
          <span id="placeholder" class="photo-icon" aria-hidden="true">▧</span>
          <img id="photo-preview" alt="Clothing photo preview" hidden>
        </div>
      </div>
    </div>

    <div class="actions">
      <a class="cancel" href="{{ url_for('closet.index') }}">Cancel</a>
      <button class="save" type="submit">Save Item</button>
    </div>
  </form>
</section>

<script>
  const input = document.getElementById('photo-input');
  const preview = document.getElementById('photo-preview');
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    if (!['image/jpeg', 'image/png'].includes(file.type) || file.size > 5 * 1024 * 1024) {
      alert('Please choose a JPG or PNG image under 5MB.');
      input.value = '';
      return;
    }
    if (preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    document.getElementById('placeholder').hidden = true;
  });
  document.getElementById('clothing-form').addEventListener('submit', (event) => {
    event.preventDefault();
    alert('Saving clothing will be implemented in Progress Report #2.');
  });
</script>
{% endblock %}
